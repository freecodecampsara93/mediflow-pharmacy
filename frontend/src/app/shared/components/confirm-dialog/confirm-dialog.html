@if (dialogService.pending(); as req) {
  <div class="dialog-backdrop" (click)="dialogService.resolve(false)">
    <div class="dialog-panel" role="alertdialog" aria-modal="true" (click)="$event.stopPropagation()">
      <h3>{{ req.title }}</h3>
      <p>{{ req.message }}</p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-secondary" (click)="dialogService.resolve(false)">{{ req.cancelLabel }}</button>
        <button
          type="button"
          class="btn"
          [class.btn-danger]="req.danger"
          [class.btn-primary]="!req.danger"
          (click)="dialogService.resolve(true)"
        >
          {{ req.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
