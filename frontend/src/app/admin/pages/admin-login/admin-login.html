<div class="admin-auth-page">
  <div class="admin-auth-card card">
    <div class="auth-heading">
      <span class="brand-mark">+</span>
      <h1>Admin sign in</h1>
      <p class="text-muted">Access the MediFlow Pharmacy control center.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field" [class.has-error]="isInvalid('email')">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
        @if (isInvalid('email')) {
          <span class="error-text">Please enter a valid email address.</span>
        }
      </div>

      <div class="field" [class.has-error]="isInvalid('password')">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
        @if (isInvalid('password')) {
          <span class="error-text">Password must be at least 6 characters.</span>
        }
      </div>

      @if (submitError()) {
        <p class="error-text form-error">{{ submitError() }}</p>
      }

      <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
        {{ submitting() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <div class="demo-hint">
      <strong>Demo admin:</strong> admin&#64;mediflow.example / Passw0rd!123
    </div>
  </div>
</div>
